services:
  db:
    image: postgres:16-alpine
    container_name: gobeach-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gobeach}
      POSTGRES_USER: ${POSTGRES_USER:-gobeach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gobeach}
      TZ: America/Sao_Paulo
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: gobeach-backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gobeach}:${POSTGRES_PASSWORD:-gobeach}@db:5432/${POSTGRES_DB:-gobeach}
      PORT: 3000
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: gobeach-frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  db-data:
